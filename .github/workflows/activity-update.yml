name: GitHub Activity Update

on:
  schedule:
    - cron: "0 4 * * *"  # Runs daily at 4 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  activity:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v3
      
      - name: GitHub Activity Stats
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "Update GitHub activity"
          MAX_LINES: 10
